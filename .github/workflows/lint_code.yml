name: Format code

on:
  workflow_dispatch:
  push:

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout self
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun i

      - name: Lint
        shell: bash
        run: bun lint:fix

      - name: Commit and push if changed
        shell: bash
        run: |
          set -x

          git add src
          git commit -m "chore: Format code" || exit 0
          git push origin hotfix
